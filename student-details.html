<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Details</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0a0f2c,#1e3a8a,#2563eb);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:550px;
background:white;
border-radius:25px;
padding:30px;
box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

h1{
text-align:center;
color:#0f172a;
margin-bottom:25px;
}

input,select{
width:100%;
padding:15px;
margin:10px 0;
border:2px solid #dbeafe;
border-radius:12px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
background:linear-gradient(135deg,#2563eb,#06b6d4);
border:none;
border-radius:12px;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:.9;
}
</style>
</head>

<body>

<div class="card">

<h1>🎓 Student Details</h1>

<input type="text" id="name" placeholder="Enter Student Name">

<input type="text" id="school" placeholder="Enter School Name">

<select id="class">
<option value="">Select Class</option>
<option value="11">Class 11</option>
<option value="12">Class 12</option>
</select>

<button onclick="startTest()">Start Test</button>

</div>

<script>

function startTest(){

let name=document.getElementById("name").value;
let school=document.getElementById("school").value;
let cls=document.getElementById("class").value;

if(name=="" || school=="" || cls==""){
alert("Please fill all details.");
return;
}

localStorage.setItem("studentName",name);
localStorage.setItem("schoolName",school);
localStorage.setItem("studentClass",cls);

if(cls=="11"){
window.location.href="class11-test.html";
}

if(cls=="12"){
window.location.href="class12-test.html";
}

}

</script>

</body>
</html>
