<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Details</title>
</head>

<body style="font-family:Arial;text-align:center;padding:30px;background:#f5f7fa;">

<h1>🎓 Student Details</h1>

<input type="text" id="name" placeholder="Student Name" style="width:90%;padding:12px;margin:10px;"><br>

<input type="text" id="school" placeholder="School Name" style="width:90%;padding:12px;margin:10px;"><br>

<select id="class" style="width:90%;padding:12px;margin:10px;">
<option value="">Select Class</option>
<option value="11">Class 11</option>
<option value="12">Class 12</option>
</select><br>

<button onclick="startTest()" style="padding:15px 30px;background:#2563eb;color:white;border:none;border-radius:10px;">
Start Test
</button>

<script>
function startTest(){

let name=document.getElementById("name").value;
let school=document.getElementById("school").value;
let cls=document.getElementById("class").value;

if(name=="" || school=="" || cls==""){
alert("Please fill all details.");
return;
}

if(cls=="11"){
window.location.href="class11-test.html";
}
else{
window.location.href="class12-test.html";
}
}
</script>

</body>
</html>
