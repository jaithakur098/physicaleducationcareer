<!DOCTYPE html>
<html>
<head>
<title>Student Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<h1>Student Details</h1>

<input type="text" id="name" placeholder="Student Name"><br><br>

<input type="text" id="school" placeholder="School Name"><br><br>

<select id="cls">
<option value="">Select Class</option>
<option value="11">Class 11</option>
<option value="12">Class 12</option>
</select>

<br><br>

<button onclick="goNext()">Start Test</button>

<script>
function goNext(){

let cls = document.getElementById("cls").value;

if(cls==""){
alert("Please select class");
return;
}

if(cls=="11"){
window.location.href="class11-test.html";
}

if(cls=="12"){
window.location.href="class12-test.html";
}

}
</script>

</body>
</html>
