<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,follow">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="student-styles.css">
<link rel="icon" href="ultimate-logo.PNG"/>
<title>Student Dashboard — PEEngine</title></head><body>
   
  
 



<header class="topbar">
  <div class="brand"><div class="logo"><i class="fa-solid fa-gauge-high"></i></div>
    <div><h1>Student <span>Dashboard</span></h1><p class="meta" id="hello">Loading…</p></div></div>
  <nav class="nav">
  <a class="btn ghost" href="student-dashboard.html">Dashboard</a>
  <a class="btn ghost" href="student-live-tests.html">Live Tests</a>
  <a class="btn ghost" href="student-practice-tests.html">Practice Tests</a>
  <a class="btn ghost" href="student-my-results.html">My Results</a>
  <a class="btn ghost" href="student-analytics.html">Analytics</a>
  <a class="btn ghost" href="student-profile.html">Profile</a>
  <button class="btn danger" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</nav>
</header>

<section class="grid g-4" style="margin-bottom:20px">
  <div class="card stat"><span class="l">Active Tests</span><span class="n mono" id="sActive">–</span></div>
  <div class="card stat"><span class="l">Tests Attempted</span><span class="n mono" id="sAttempts">–</span></div>
  <div class="card stat"><span class="l">Best Score %</span><span class="n mono" id="sBest">–</span></div>
  <div class="card stat"><span class="l">Avg Score %</span><span class="n mono" id="sAvg">–</span></div>
</section>

<section class="grid g-2">
  <div class="card">
    <h2 style="margin-bottom:12px;font-size:18px">Quick Actions</h2>
    <div style="display:grid;gap:10px">
      <a class="btn primary" href="student-live-tests.html"><i class="fa-solid fa-play"></i> Attempt Live Test</a>
      <a class="btn primary" href="student-practice-tests.html"><i class="fa-solid fa-graduation-cap"></i> Practice Tests</a>
      <a class="btn" href="student-my-results.html"><i class="fa-solid fa-chart-line"></i> View My Results</a>
      <a class="btn" href="student-analytics.html"><i class="fa-solid fa-chart-pie"></i> Performance Analytics</a>
      <a class="btn" href="student-profile.html"><i class="fa-solid fa-user-pen"></i> Update Profile</a>
    </div>
  </div>
  <div class="card">
    <h2 style="margin-bottom:12px;font-size:18px">Recent Attempts</h2>
    <div id="recent"><p class="empty">Loading…</p></div>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config/firebase-init.js"></script>
<script src="config/admin-data.js"></script>
<script src="config/student-data.js"></script><script>
Student.onChange(function(u){ if(!u){ location.href="student-login.html"; } });
document.addEventListener("click",function(e){
  if(e.target.closest("#logoutBtn")){ Student.logout().then(function(){ location.href="student-login.html"; }); }
});
</script>
<script>
Student.onChange(async function(u){
  if(!u) return;
  var prof = await Student.getProfile(u.uid);
  document.getElementById('hello').textContent = 'Welcome, '+(prof?prof.name:u.email);
  try{
    var tests = await Student.listActiveTests();
    document.getElementById('sActive').textContent = tests.length;
  }catch(e){ document.getElementById('sActive').textContent='0'; }
  var allResults = await Student.myResults(u.uid);
  // Statistics reflect APPROVED attempts only (admin verification workflow).
  var results = allResults.filter(function(r){ return (r.status||'pending')==='approved'; });
  document.getElementById('sAttempts').textContent = results.length;
  if(results.length){
    var best = Math.max.apply(null, results.map(function(r){return r.percent||0;}));
    var avg  = results.reduce(function(a,r){return a+(r.percent||0);},0)/results.length;
    document.getElementById('sBest').textContent = best.toFixed(1);
    document.getElementById('sAvg').textContent  = avg.toFixed(1);
    document.getElementById('recent').innerHTML =
      '<table><thead><tr><th>Test</th><th>Score</th><th>%</th></tr></thead><tbody>'+
      results.slice(0,5).map(function(r){
        return '<tr><td>'+(r.testTitle||'—')+'</td><td class="mono">'+(r.score||0)+'/'+(r.maxMarks||0)+'</td><td class="mono">'+(r.percent||0).toFixed(1)+'%</td></tr>';
      }).join('')+'</tbody></table>';
  } else {
    document.getElementById('sBest').textContent='0';
    document.getElementById('sAvg').textContent='0';
    document.getElementById('recent').innerHTML='<p class="empty">No approved attempts yet.</p>';
  }
});
</script>  <script src="js/site-ads.js"></script>
</body></html>
