<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 12 Chapter 1 Test</title>

<script src="class12-ch1-questions.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:12px;
}

.question{
margin-bottom:20px;
padding:15px;
border:1px solid #ddd;
border-radius:10px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

#result{
margin-top:20px;
padding:20px;
background:#eef;
display:none;
border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Class 12 Chapter 1 Test</h1>

<p><b>Name:</b> <span id="studentName"></span></p>
<p><b>School:</b> <span id="schoolName"></span></p>
<p><b>Class:</b> <span id="studentClass"></span></p>

<div id="questionsContainer"></div>

<button onclick="showResult()">Submit Test</button>

<div id="result"></div>

</div>

<script>

document.getElementById("studentName").innerText =
localStorage.getItem("studentName") || "Student";

document.getElementById("schoolName").innerText =
localStorage.getItem("schoolName") || "-";

document.getElementById("studentClass").innerText =
localStorage.getItem("studentClass") || "12";

const selectedQuestions =
questions.sort(() => Math.random()-0.5).slice(0,20);

const container =
document.getElementById("questionsContainer");

selectedQuestions.forEach((q,index)=>{

let html = `
<div class="question">
<p><b>${index+1}. ${q.question}</b></p>
`;

q.options.forEach(opt=>{
html += `
<label>
<input type="radio"
name="q${index}"
value="${opt===q.answer ? 1 : 0}">
 ${opt}
</label><br>
`;
});

html += `</div>`;

container.innerHTML += html;
});

function showResult(){

let score=0;

document
.querySelectorAll('input[type="radio"]:checked')
.forEach(ans=>{
score += Number(ans.value);
});

let total=20;
let wrong=total-score;
let percentage=(score/total)*100;

let grade="C";

if(percentage>=90) grade="A+";
else if(percentage>=75) grade="A";
else if(percentage>=60) grade="B";

let status =
percentage>=50 ? "PASS ✅" : "FAIL ❌";

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=`

<h2>🏆 Performance Report</h2>

<p><b>Name:</b>
${localStorage.getItem("studentName") || "Student"}</p>

<p><b>School:</b>
${localStorage.getItem("schoolName") || "-"}</p>

<p><b>Class:</b>
${localStorage.getItem("studentClass") || "12"}</p>

<p><b>Correct Answers:</b> ${score}</p>
<p><b>Wrong Answers:</b> ${wrong}</p>
<p><b>Score:</b> ${score}/20</p>
<p><b>Percentage:</b> ${percentage.toFixed(2)}%</p>
<p><b>Grade:</b> ${grade}</p>
<p><b>Status:</b> ${status}</p>

`;
}

</script>

</body>
</html>
