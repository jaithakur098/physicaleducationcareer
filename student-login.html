<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="student-styles.css">
<link rel="icon" href="ultimate-logo.PNG"/>
<title>Student Login — PEEngine</title></head><body>
<div class="centered">
  <header class="topbar"><div class="brand"><div class="logo"><i class="fa-solid fa-graduation-cap"></i></div><h1>Student <span>Login</span></h1></div></header>
  <div class="card">
    <div id="msg"></div>
    <form id="f">
      <div class="form-row"><label>Email</label><input type="email" name="email" required></div>
      <div class="form-row"><label>Password</label><input type="password" name="password" required></div>
      <button class="btn primary" style="width:100%" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Sign in</button>
    </form>
    <div style="display:flex;justify-content:space-between;margin-top:14px;font-size:13px">
      <a href="student-forgot.html">Forgot password?</a>
      <a href="student-register.html">Create account</a>
    </div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config/firebase-init.js"></script>
<script src="config/admin-data.js"></script>
<script src="config/student-data.js"></script>
<script>
document.getElementById('f').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var msg=document.getElementById('msg'); msg.innerHTML='';
  var d=Object.fromEntries(new FormData(ev.target).entries());
  try{
    await Student.login(d.email, d.password);
    location.href='student-dashboard.html';
  }catch(e){ msg.innerHTML='<div class="msg err">'+(e.message||e)+'</div>'; }
});
</script></body></html>
