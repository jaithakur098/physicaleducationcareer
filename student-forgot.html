<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,follow">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="student-styles.css">
<link rel="icon" href="ultimate-logo.PNG"/>
<title>Forgot Password — PEEngine</title></head><body>
<div class="centered">
  <header class="topbar"><div class="brand"><div class="logo"><i class="fa-solid fa-key"></i></div><h1>Forgot <span>Password</span></h1></div></header>
  <div class="card">
    <div id="msg"></div>
    <form id="f">
      <div class="form-row"><label>Registered Email</label><input type="email" name="email" required></div>
      <button class="btn primary" style="width:100%" type="submit"><i class="fa-solid fa-paper-plane"></i> Send Reset Link</button>
    </form>
    <p class="meta" style="margin-top:14px;text-align:center"><a href="student-login.html">Back to login</a></p>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config/firebase-init.js"></script>
<script src="config/admin-data.js"></script>
<script src="config/student-data.js"></script>
<script>
document.getElementById('f').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var msg=document.getElementById('msg'); msg.innerHTML='';
  var d=Object.fromEntries(new FormData(ev.target).entries());
  try{ await Student.forgotPassword(d.email);
    msg.innerHTML='<div class="msg ok">Reset link sent. Check your email inbox.</div>';
  }catch(e){ msg.innerHTML='<div class="msg err">'+(e.message||e)+'</div>'; }
});
</script>  
</body></html>
