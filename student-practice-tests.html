<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="student-styles.css">
<link rel="icon" href="ultimate-logo.PNG"/>
<title>Practice Tests — PEEngine</title></head><body>
<header class="topbar">
  <div class="brand"><div class="logo"><i class="fa-solid fa-graduation-cap"></i></div><h1>Practice <span>Tests</span></h1></div>
  <nav class="nav">
    <a class="btn ghost" href="student-dashboard.html">Dashboard</a>
    <a class="btn ghost" href="student-live-tests.html">Live Tests</a>
    <a class="btn ghost" href="student-practice-tests.html">Practice Tests</a>
    <a class="btn ghost" href="student-my-results.html">My Results</a>
    <a class="btn ghost" href="student-profile.html">Profile</a>
    <button class="btn danger" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </nav>
</header>
<div id="list" class="grid g-3"><div class="empty">Loading…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config/firebase-init.js"></script>
<script src="config/admin-data.js"></script>
<script src="config/student-data.js"></script>
<script src="config/practice-data.js"></script>
<script>
Student.onChange(function(u){ if(!u){ location.href="student-login.html"; } });
document.addEventListener("click",function(e){
  if(e.target.closest("#logoutBtn")){ Student.logout().then(function(){ location.href="student-login.html"; }); }
});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
Student.onChange(async function(u){
  if(!u) return;
  var list=document.getElementById('list');
  try{
    var tests = await Practice.listPublished();
    if(!tests.length){ list.innerHTML='<div class="empty">No practice tests available yet.</div>'; return; }
    list.innerHTML = tests.map(function(t){
      return '<article class="card"><span class="badge good">Practice</span>'+
        '<h3 style="margin:8px 0;font-size:18px">'+esc(t.title||'Untitled')+'</h3>'+
        '<p class="meta">Questions: '+(t.totalQuestions||'—')+' • Duration: '+(t.durationMin||'—')+' min</p>'+
        '<p class="meta">Marks/Q: '+(t.marksPerQuestion||1)+' • Negative: '+(t.negativeMarks||0)+'</p>'+
        '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+
          '<a class="btn primary" href="student-practice-attempt.html?id='+t.id+'"><i class="fa-solid fa-play"></i> Start Practice</a>'+
          '<a class="btn" href="student-practice-leaderboard.html?id='+t.id+'"><i class="fa-solid fa-trophy"></i> Leaderboard</a>'+
        '</div>'+
      '</article>';
    }).join('');
  }catch(e){ list.innerHTML='<div class="empty">Failed to load: '+esc(e.message||e)+'</div>'; }
});
</script></body></html>
