<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="student-styles.css">
<link rel="icon" href="ultimate-logo.PNG"/>
<style>
.review-hdr{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.review-card{ background:var(--glass-bg,.6); border:1px solid var(--glass-border);
  border-radius:14px; padding:20px; margin-bottom:14px; }
.opt-row{padding:12px 14px;border:1px solid var(--glass-border);border-radius:10px;margin:8px 0;
  display:flex;gap:12px;align-items:flex-start}
.opt-letter{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto}
.opt-row.correct{background:rgba(46,204,113,.14);border-color:#2ecc71}
.opt-row.wrong{background:rgba(231,76,60,.14);border-color:#e74c3c}
.opt-row.selections-none{border-color:rgba(233,69,96,.5)}
.opt-row .tag{margin-left:auto;font-size:11px;padding:3px 8px;border-radius:20px;text-transform:uppercase;
  letter-spacing:.06em;font-weight:700}
.opt-row.correct .tag{background:#2ecc71;color:#08331d}
.opt-row.wrong .tag{background:#e74c3c;color:#fff}
.qmeta{color:var(--ink-mute);font-size:13px;margin-bottom:6px}
.expl{margin-top:12px;padding:12px 14px;border-left:3px solid #d4af37;background:rgba(212,175,55,.08);
  border-radius:6px;color:#dbe4ff;font-size:14px;line-height:1.6}
.not-attempted-box{margin-top:10px;padding:10px 14px;border-radius:8px;
  background:rgba(230,146,35,.1);border:1px solid #e67e22;color:#f39c12;font-size:13px}
</style>
<title>Result — PEEngine</title></head><body>
<header class="topbar">
  <div class="brand"><div class="logo"><i class="fa-solid fa-award"></i></div><h1>Test <span>Result</span></h1></div>
  <nav class="nav">
  <a class="btn ghost" href="student-dashboard.html">Dashboard</a>
  <a class="btn ghost" href="student-live-tests.html">Live Tests</a>
  <a class="btn ghost" href="student-my-results.html">My Results</a>
  <a class="btn ghost" href="student-analytics.html">Analytics</a>
  <a class="btn ghost" href="student-profile.html">Profile</a>
  <button class="btn danger" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</nav>
</header>
<div id="out"><p class="empty">Loading…</p></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config/firebase-init.js"></script>
<script src="config/admin-data.js"></script>
<script src="config/student-data.js"></script>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
  function fmtTime(sec){ sec=Number(sec)||0; var m=Math.floor(sec/60), s=sec%60; return m+'m '+String(s).padStart(2,'0')+'s'; }

  function norm(v){ return v==null?'':String(v).trim().toLowerCase(); }
  function pick(o){ for(var i=1;i<arguments.length;i++){var v=o[arguments[i]]; if(v!=null&&v!=='')return v;} return '';}

  Student.onChange(function(u){ if(!u){ location.href="student-login.html"; } });
  document.addEventListener("click",function(e){
    if(e.target.closest("#logoutBtn")){ Student.logout().then(function(){ location.href="student-login.html"; }); }
  });

  Student.onChange(async function(u){
    if(!u) return;
    var id=new URLSearchParams(location.search).get('id');
    if(!id){ document.getElementById('out').innerHTML='<p class="empty">Missing result id.</p>'; return; }
    var r = await Student.getAttempt(id);
    if(!r){ document.getElementById('out').innerHTML='<p class="empty">Result not found.</p>'; return; }

    if (window.PECAds) PECAds.triggerAction('result_view');

    var pass=(r.percent||0)>=40;
    var certEligible=(r.percent||0)>=90;

    document.getElementById('out').innerHTML =
      '<section class="grid g-4" style="margin-bottom:20px">'+
        '<div class="card stat"><span class="l">Score</span><span class="n mono">'+r.score+' / '+r.maxMarks+'</span></div>'+
        '<div class="card stat"><span class="l">Percentage</span><span class="n mono">'+(r.percent||0).toFixed(1)+'%</span></div>'+
        '<div class="card stat"><span class="l">Correct</span><span class="n mono">'+r.correct+' / '+r.total+'</span></div>'+
        '<div class="card stat"><span class="l">Wrong</span><span class="n mono">'+r.wrong+'</span></div>'+
      '</section>'+
      '<div class="card"><h2 style="margin-bottom:8px">'+esc(r.testTitle||'Test')+'</h2>'+
        '<p class="meta">Duration used: '+Math.floor((r.durationSec||0)/60)+'m '+((r.durationSec||0)%60)+'s '+
        (r.autoSubmitted?'• <span class="badge warn">Auto-submitted</span>':'')+'</p>'+
        '<p style="margin-top:10px"><span class="badge '+(pass?'good':'bad')+'">'+(pass?'PASS':'FAIL')+'</span></p>'+
        '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">'+
          '<a class="btn primary" href="student-leaderboard.html?id='+r.testId+'"><i class="fa-solid fa-trophy"></i> Leaderboard</a>'+
          (certEligible?'<a class="btn" href="student-certificate.html?id='+r.id+'"><i class="fa-solid fa-certificate"></i> View Certificate</a>':'')+
          '<a class="btn ghost" href="student-my-results.html">All Results</a>'+
        '</div></div>';

    // ---- Solved Questions / Answer Review ----
    var answers=(r.answers||[]);
    if(!answers.length){
      document.getElementById('out').innerHTML += '<div class="card" style="margin-top:20px"><h3>Solved Questions</h3><p class="empty">No answer data available for review.</p></div>';
      return;
    }

    // Load the original question text + options from the shared Question Bank.
    var db=firebase.firestore();
    var qids=answers.map(function(a){return a.qid;}).filter(Boolean);
    var qmap={};
    // Bulk-fetch via collection doc reads (compat SDK — sequential is fine for ≤100).
    for(var i=0;i<qids.length;i++){
      if(qmap[qids[i]]) continue;
      try{
        var snap=await db.collection('questions').doc(qids[i]).get();
        if(snap.exists) qmap[qids[i]]=Object.assign({id:snap.id},snap.data());
        else qmap[qids[i]]={missing:true};
      }catch(e){ qmap[qids[i]]={missing:true}; }
    }

    var section='<div class="card" style="margin-top:20px"><h3 style="margin-top:0">Solved Questions</h3>';
    section+='<div class="review-hdr">'+
      '<div class="stat-box"><div class="l">Correct</div><div class="n" style="color:#2ecc71">'+r.correct+'</div></div>'+
      '<div class="stat-box"><div class="l">Wrong</div><div class="n" style="color:#e74c3c">'+r.wrong+'</div></div>'+
      '<div class="stat-box"><div class="l">Not Attempted</div><div class="n">'+Math.max(0,(r.total||0)-(answers.filter(function(a){return a.picked;}).length))+'</div></div>'+
      '<div class="stat-box"><div class="l">Score</div><div class="n mono">'+r.score+' / '+r.maxMarks+'</div></div>'+
      '</div>';

    for(var i=0;i<answers.length;i++){
      var a=answers[i];
      var q=qmap[a.qid];
      // The attempt stores `correct` as a letter ('A'..'D'); the question row
      // may store correct as A/B/C/D or 0/1/2/3. Normalise to uppercase letter.
      var correctLetter = (a.correct||'').toString().toUpperCase();
      var pickedLetter = (a.picked||a.selected||a.chosen||'').toString().toUpperCase();
      var isUnattempted = (!pickedLetter || pickedLetter==='NULL' || (pickedLetter==='0' && a.picked==null));

      // Resolve option texts from the question row (support every schema variant).
      var oArr = q && (q.options||q.opts||null);
      var optTexts=[
        { L:'A', txt: pick(q||{},'optionA','option_a','OptionA','a','A') },
        { L:'B', txt: pick(q||{},'optionB','option_b','OptionB','b','B') },
        { L:'C', txt: pick(q||{},'optionC','option_c','OptionC','c','C') },
        { L:'D', txt: pick(q||{},'optionD','option_d','OptionD','d','D') }
      ];
      // Fallback: if schema was options[] array
      if((!optTexts[0].txt||!optTexts[1].txt||!optTexts[2].txt||!optTexts[3].txt) && oArr && oArr.length){
        optTexts=[
          {L:'A',txt:oArr[0]||''},{L:'B',txt:oArr[1]||''},
          {L:'C',txt:oArr[2]||''},{L:'D',txt:oArr[3]||''}
        ];
      }

      section+='<div class="review-card">';
      section+='<div class="qmeta">Question '+(i+1)+' of '+answers.length+'</div>';
      if(!q){
        section+='<p class="empty">Question data not available.</p>';
      } else if(q.missing){
        section+='<p class="empty">Original question was removed from the bank.</p>';
      } else {
        section+='<h3 style="margin:6px 0 12px;font-family:Playfair Display,serif">'+
          esc(q.question||q.text||q.questionText||q.q||'—')+'</h3>';
        optTexts.forEach(function(o){
          var isCorrect = (o.L===correctLetter);
          var isPicked  = (pickedLetter && o.L===pickedLetter);
          var cls='', tag='';
          if(isCorrect){ cls='correct'; tag='<span class="tag">✓ Correct Answer</span>'; }
          else if(isPicked){ cls='wrong'; tag='<span class="tag">✗ Your Answer</span>'; }
          // Edge case: student selected the correct answer → only show one green tag
          if(isCorrect && isPicked){ cls='correct'; tag='<span class="tag">✓ Your Answer (Correct)</span>'; }
          if(!q.missing && !q.question){ } // noop guard
          section+='<div class="opt-row '+cls+'">'+
            '<div class="opt-letter">'+o.L+'</div>'+
            '<div style="flex:1">'+esc(o.txt||'—')+'</div>'+tag+'</div>';
        });
        if(isUnattempted){
          section+='<div class="not-attempted-box"><i class="fa-solid fa-circle-info"></i> You did not attempt this question.</div>';
        }
      }
      // Explanation if available
      var _expl = q && (q.explanation||q.explaination||q.solution||'');
      if(_expl) section+='<div class="expl"><b>Explanation:</b> '+esc(_expl)+'</div>';
      section+='</div>';
    }

    section+='</div>';
    document.getElementById('out').innerHTML += section;
  });
})();
</script>

<script src="/js/site-ads.js"></script>
</body></html>
