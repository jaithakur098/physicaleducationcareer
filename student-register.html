<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,follow">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="student-styles.css">
<link rel="icon" href="ultimate-logo.PNG"/>
<title>Student Registration — PEEngine</title></head><body>
<div class="centered">
  <header class="topbar"><div class="brand"><div class="logo"><i class="fa-solid fa-user-plus"></i></div><h1>Student <span>Registration</span></h1></div></header>
  <div class="card">
    <div id="msg"></div>
    <form id="f">
      <div class="form-row"><label>Full Name *</label><input name="name" required></div>
      <div class="form-row"><label>Email *</label><input type="email" name="email" required></div>
      <div class="form-row"><label>Password * (min 6 chars)</label><input type="password" name="password" minlength="6" required></div>
      <div class="form-row"><label>Phone</label><input name="phone"></div>
      <div class="form-row"><label>Class *</label><select id="cls" name="className" required><option value="">Loading…</option></select></div>
      <div class="form-row"><label>School / College</label><input name="school"></div>
      <div class="form-row"><label>City</label><input name="city"></div>
      <div class="form-row"><label>State</label><input name="state"></div>
      <button class="btn primary" style="width:100%" type="submit"><i class="fa-solid fa-user-plus"></i> Create Account</button>
    </form>
    <p class="meta" style="margin-top:14px;text-align:center">Already registered? <a href="student-login.html">Sign in</a></p>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config/firebase-init.js"></script>
<script src="config/admin-data.js"></script>
<script src="config/student-data.js"></script>
<script>
(async function(){
  try{
    var classes = await AdminData.listClasses();
    document.getElementById('cls').innerHTML = '<option value="">Select class</option>' +
      classes.map(function(c){return '<option value="'+c.id+'">'+c.label+'</option>';}).join('');
  }catch(e){ document.getElementById('cls').innerHTML='<option value="">(no classes)</option>'; }
})();
document.getElementById('f').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var msg=document.getElementById('msg'); msg.innerHTML='';
  var d=Object.fromEntries(new FormData(ev.target).entries());
  try{
    await Student.register(d);
    msg.innerHTML='<div class="msg ok">Account created. Redirecting…</div>';
    setTimeout(function(){location.href='student-dashboard.html';},800);
  }catch(e){ msg.innerHTML='<div class="msg err">'+(e.message||e)+'</div>'; }
});
</script></body></html>
