<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,follow">
<title>Live Tests — PEEngine</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --navy-900:#050b1f;--navy-800:#0a1633;--navy-700:#0f2148;
    --gold-500:#d4af37;--gold-400:#e6c458;--gold-300:#f2d97a;
    --ink:#e9eefb;--ink-soft:#b8c2dc;--ink-mute:#8892b2;
    --glass:rgba(255,255,255,0.06);--glass-border:rgba(212,175,55,0.22);
    --success:#3ddc97;--danger:#ff5c7a;
    --radius:16px;--shadow:0 20px 60px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,sans-serif;color:var(--ink);min-height:100vh;
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(212,175,55,.15), transparent 60%),
      linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 45%, var(--navy-700) 100%);
    padding:24px;
  }
  header{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
  .logo{width:44px;height:44px;border-radius:12px;
    background:linear-gradient(135deg,var(--gold-500),var(--gold-300));
    display:grid;place-items:center;color:#1a1206;font-weight:800}
  h1{font-family:'Playfair Display',serif;font-size:24px}
  h1 span{color:var(--gold-400)}
  .filters{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:640px;margin-bottom:20px}
  select{
    background:rgba(10,22,51,.6);border:1px solid var(--glass-border);
    color:var(--ink);padding:11px 13px;border-radius:12px;font-size:14px;width:100%;outline:none;
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .test{
    background:var(--glass);border:1px solid var(--glass-border);
    border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:10px;
  }
  .test h3{font-family:'Playfair Display',serif;font-size:18px}
  .meta{font-size:12px;color:var(--ink-mute);line-height:1.6}
  .badge{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(61,220,151,.15);color:var(--success);display:inline-block;width:fit-content}
  .go{
    margin-top:auto;padding:11px 16px;border-radius:12px;text-align:center;text-decoration:none;
    background:linear-gradient(135deg,var(--gold-500),var(--gold-300));color:#1a1206;font-weight:600;
  }
  .empty{text-align:center;color:var(--ink-mute);padding:40px}
  @media (max-width:640px){ .filters{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="logo"><i class="fa-solid fa-broadcast-tower"></i></div>
  <h1>Live <span>Tests</span></h1>
</header>

<div class="filters">
  <select id="fClass"><option value="">All Classes</option></select>
  <select id="fSubject"><option value="">All Subjects</option></select>
</div>

<div id="list" class="grid"><div class="empty">Loading…</div></div>

<script src="config/firebase-init.js"></script>
<script src="config/admin-data.js"></script>
<script>
async function init(){
  const classes = await AdminData.listClasses();
  const cSel=document.getElementById('fClass');
  cSel.innerHTML = '<option value="">All Classes</option>' +
    classes.map(c=>`<option value="${c.id}">${c.label}</option>`).join('');
  cSel.onchange = async ()=>{
    const cls=cSel.value; const sSel=document.getElementById('fSubject');
    sSel.innerHTML='<option value="">All Subjects</option>';
    if(cls){
      const subs=await AdminData.listSubjects(cls);
      sSel.innerHTML+=subs.map(s=>`<option value="${s.id}">${s.label}</option>`).join('');
    }
    render();
  };
  document.getElementById('fSubject').onchange = render;
  render();
}
function fmtDT(v){ if(!v) return '—'; const d=v.toDate?v.toDate():new Date(v); return isNaN(d)?'—':d.toLocaleString([], {dateStyle:'medium', timeStyle:'short'}); }
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function render(){
  const cls=document.getElementById('fClass').value;
  const sub=document.getElementById('fSubject').value;
  const list=document.getElementById('list');
  list.innerHTML='<div class="empty">Loading…</div>';
  try{
    const tests = await AdminData.listPublishedTests(cls||null, sub||null);
    if(!tests.length){ list.innerHTML='<div class="empty">No live tests available right now.</div>'; return; }
    list.innerHTML = tests.map(t=>`
      <article class="test">
        <span class="badge">Live</span>
        <h3>${esc(t.title||'Untitled Test')}</h3>
        <div class="meta">
          ${esc(t.classId||'')} · ${esc(t.subjectId||'')} · ${esc(t.chapterId||'')}<br/>
          ${t.totalQuestions||0} Qs · ${t.durationMin||0} min · neg ${t.negativeMarking||0}<br/>
          ${fmtDT(t.startTime)} → ${fmtDT(t.endTime)}
        </div>
        <a class="go" href="${esc(t.testUrl||'#')}">Start Test <i class="fa-solid fa-arrow-right"></i></a>
      </article>`).join('');
  }catch(e){
    list.innerHTML=`<div class="empty">Failed to load tests: ${esc(e.message)}</div>`;
  }
}
window.addEventListener('DOMContentLoaded', init);
</script>
  <script src="js/site-ads.js"></script>
</body>
</html>
