<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow">
<title>Admin Login — PEEngine</title>
<link rel="icon" href="ultimate-logo.PNG"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;color:#e9eefb;
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(212,175,55,.15), transparent 60%),
      radial-gradient(900px 500px at -10% 20%, rgba(90,169,255,.12), transparent 60%),
      linear-gradient(135deg,#050b1f 0%,#0a1633 45%,#0f2148 100%);
    min-height:100vh;display:grid;place-items:center;padding:24px;
  }
  .card{
    width:100%;max-width:420px;background:rgba(255,255,255,0.06);
    border:1px solid rgba(212,175,55,0.28);border-radius:18px;
    padding:32px;backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,#d4af37,#f2d97a);color:#1a1206;font-weight:800}
  h1{font-family:'Playfair Display',serif;font-size:22px}
  h1 span{color:#e6c458}
  label{display:block;font-size:13px;color:#b8c2dc;margin:14px 0 6px}
  input{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.25);color:#e9eefb;font-size:14px;outline:none;
  }
  input:focus{border-color:#d4af37}
  button{
    margin-top:20px;width:100%;padding:12px 14px;border:none;border-radius:10px;
    background:linear-gradient(135deg,#d4af37,#e6c458);color:#1a1206;
    font-weight:700;cursor:pointer;font-size:15px;
  }
  button:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px;display:none}
  .msg.err{display:block;background:rgba(255,92,122,.15);color:#ff9db0;border:1px solid rgba(255,92,122,.35)}
  .foot{margin-top:18px;text-align:center;font-size:12px;color:#8892b2}
  .foot a{color:#e6c458;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-shield-halved"></i></div>
      <h1>Admin <span>Login</span></h1>
    </div>
    <form id="f" autocomplete="off">
      <label>Admin Email</label>
      <input type="email" name="email" required autocomplete="username"/>
      <label>Password</label>
      <input type="password" name="password" required autocomplete="current-password"/>
      <button type="submit" id="btn"><i class="fa-solid fa-right-to-bracket"></i> Sign in</button>
    </form>
    <div id="msg" class="msg"></div>
    <div class="foot">Authorized administrators only. <a href="index.html">Back to Home</a></div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config/firebase-init.js"></script>
<script>
(function(){
  var form=document.getElementById('f');
  var msg=document.getElementById('msg');
  var btn=document.getElementById('btn');

  function redirectTarget(){
    var next=new URLSearchParams(location.search).get('next');
    if(!next||/^(https?:|\/\/)/i.test(next)) return 'admin.html';
    if(!/^[\w.\-]+\.html$/.test(next)) return 'admin.html';
    return next;
  }

  function fail(text){
    msg.className='msg err';
    msg.textContent=text||'Access denied.';
    btn.disabled=false;
  }

  async function goIfAdmin(user){
    if(!user) return;
    try{
      var d=await firebase.firestore().collection('admins').doc(user.uid).get();
      if(d.exists){ location.replace(redirectTarget()); }
    }catch(_){}
  }

  firebase.auth().onAuthStateChanged(function(u){ goIfAdmin(u); });

  form.addEventListener('submit', async function(ev){
    ev.preventDefault();
    msg.className='msg'; msg.textContent=''; btn.disabled=true;
    var d=Object.fromEntries(new FormData(form).entries());
    try{
      var cred=await firebase.auth().signInWithEmailAndPassword(d.email.trim(), d.password);
      var doc=await firebase.firestore().collection('admins').doc(cred.user.uid).get();
      if(doc.exists){
        location.replace(redirectTarget());
      } else {
        await firebase.auth().signOut();
        return fail('This account is not authorized as an admin.');
      }
    }catch(e){
      fail(e && e.message ? e.message : 'Sign-in failed.');
    }
  });
})();
</script>
</body>
</html>
