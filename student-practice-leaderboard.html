<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="student-styles.css">
<link rel="icon" href="ultimate-logo.PNG"/>
<title>Practice Leaderboard — PEEngine</title></head><body>
<header class="topbar">
  <div class="brand"><div class="logo"><i class="fa-solid fa-trophy"></i></div><h1>Practice <span>Leaderboard</span></h1></div>
  <nav class="nav">
    <a class="btn ghost" href="student-practice-tests.html">Practice Tests</a>
    <a class="btn ghost" href="student-dashboard.html">Dashboard</a>
  </nav>
</header>
<div id="wrap" class="card"><p class="empty">Loading…</p></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config/firebase-init.js"></script>
<script src="config/admin-data.js"></script>
<script src="config/student-data.js"></script>
<script src="config/practice-data.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
var id=new URLSearchParams(location.search).get('id');
Student.onChange(async function(u){
  if(!u){ location.href='student-login.html'; return; }
  var wrap=document.getElementById('wrap');
  if(!id){ wrap.innerHTML='<p class="empty">Missing test id.</p>'; return; }
  var t = await Practice.get(id);
  var rows = await Practice.leaderboard(id, 100);
  var head = '<h2 style="margin-top:0">'+esc((t&&t.title)||'Practice Test')+' — Top Scorers</h2>';
  if(!rows.length){ wrap.innerHTML=head+'<p class="empty">No attempts yet. Be the first!</p>'; return; }
  wrap.innerHTML = head + '<table><thead><tr><th>#</th><th>Student</th><th>Score</th><th>%</th><th>Duration</th></tr></thead><tbody>'+
    rows.map(function(r,i){
      return '<tr'+(r.studentId===u.uid?' style="background:rgba(212,175,55,.12)"':'')+'>'+
        '<td class="mono">'+(i+1)+'</td>'+
        '<td>'+esc(r.studentName||'Anonymous')+'</td>'+
        '<td class="mono">'+(r.score||0)+' / '+(r.maxMarks||0)+'</td>'+
        '<td class="mono">'+((r.percent||0).toFixed(1))+'%</td>'+
        '<td class="mono">'+(r.durationSec||0)+'s</td>'+
      '</tr>';
    }).join('')+'</tbody></table>';
});
 </script>  

<script src="/js/site-ads.js"></script>
</body></html>
