<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,follow">
<title>Verify Certificate — PhysicalEducationCareer.in</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" href="ultimate-logo.PNG"/>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#050b1e,#0a1f5c);color:#fff;min-height:100vh}
.wrap{max-width:640px;margin:40px auto;padding:0 16px}
.brand{text-align:center;margin-bottom:20px}
.brand h1{font-family:'Playfair Display',serif;color:#d4af37;letter-spacing:.08em;margin:0}
.brand p{color:#dbe4ff;margin:4px 0 0;font-size:13px}
.card{background:rgba(15,33,72,.7);border:1px solid #d4af37;border-radius:14px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.status{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;margin-bottom:20px;font-weight:700}
.status.ok{background:rgba(46,204,113,.15);border:1px solid #2ecc71;color:#2ecc71}
.status.err{background:rgba(231,76,60,.15);border:1px solid #e74c3c;color:#e74c3c}
.status i{font-size:24px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed rgba(255,255,255,.1);font-size:14px}
.row:last-child{border:0}
.row .k{color:#dbe4ff;opacity:.7}.row .v{color:#fff;font-weight:600;text-align:right;max-width:60%;word-break:break-word}
.search{display:flex;gap:8px;margin-bottom:20px}
.search input{flex:1;padding:12px;border-radius:8px;border:1px solid rgba(212,175,55,.4);background:rgba(255,255,255,.05);color:#fff;font-size:14px;font-family:monospace}
.search button{padding:12px 20px;background:linear-gradient(135deg,#d4af37,#b8860b);color:#1a1206;border:none;border-radius:8px;font-weight:800;cursor:pointer}
.foot{text-align:center;color:#dbe4ff;font-size:12px;margin-top:20px;opacity:.8}
.foot a{color:#d4af37}
</style></head><body>
<div class="wrap">
  <div class="brand">
    <h1><i class="fa-solid fa-shield-halved"></i> Certificate Verification</h1>
    <p>PhysicalEducationCareer.in · Official Verification Portal</p>
  </div>
  <div class="search">
    <input type="text" id="idInput" placeholder="Enter Certificate ID (e.g. PEC-2026-000001)">
    <button id="lookupBtn">Verify</button>
  </div>
  <div id="result"></div>
  <div class="foot">
    Every certificate carries a unique ID and QR code. Scan or enter the ID above to verify authenticity.<br>
    <a href="index.html">← Back to PhysicalEducationCareer.in</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config/firebase-init.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function fmtDate(d){ try { return d && d.toDate ? d.toDate().toLocaleString() : (d||'—'); } catch(_){ return '—'; } }
function looksLikeDocId(v){ v=String(v==null?'':v).trim(); return /^[A-Za-z0-9_-]{16,}$/.test(v); }
var nameMaps=null;
async function loadNameMaps(){
  if(nameMaps) return nameMaps;
  nameMaps={cls:{},sub:{},ch:{}};
  try{
    var fs=firebase.firestore();
    var r=await Promise.all([fs.collection('classes').get(),fs.collection('subjects').get(),fs.collection('chapters').get()]);
    r[0].docs.forEach(function(d){ var x=d.data(); nameMaps.cls[d.id.toLowerCase()]=x.label||x.name||x.title||''; });
    r[1].docs.forEach(function(d){ var x=d.data(); nameMaps.sub[d.id.toLowerCase()]=x.label||x.name||x.title||''; });
    r[2].docs.forEach(function(d){ var x=d.data(); nameMaps.ch[d.id.toLowerCase()]=x.title||x.label||x.name||''; });
  }catch(_){ }
  return nameMaps;
}
function displayName(raw,map){
  raw=String(raw==null?'':raw).trim();
  if(!raw) return '—';
  var hit=map && map[raw.toLowerCase()];
  if(hit) return hit;
  return looksLikeDocId(raw) ? '—' : raw; // never show Firestore document IDs
}

async function verify(id){
  var out = document.getElementById('result');
  out.innerHTML='<div class="card"><p style="text-align:center;color:#dbe4ff">Checking…</p></div>';
  if (!id){ out.innerHTML='<div class="card"><div class="status err"><i class="fa-solid fa-triangle-exclamation"></i> Please enter a Certificate ID.</div></div>'; return; }
  try {
    var s = await firebase.firestore().collection('certificates').doc(id).get();
    if (!s.exists){
      out.innerHTML='<div class="card"><div class="status err"><i class="fa-solid fa-xmark-circle"></i> Certificate not found or invalid.</div><p style="color:#dbe4ff;text-align:center">The ID <b>'+esc(id)+'</b> does not match any issued certificate.</p></div>';
      return;
    }
    var c = s.data();
    var maps = await loadNameMaps();
    var testName = String(c.testTitle||'').trim();
    if(!testName || looksLikeDocId(testName)){
      try{
        var cols=['practice_tests','live_tests'];
        for(var i=0;i<cols.length && c.testId;i++){
          var td=await firebase.firestore().collection(cols[i]).doc(String(c.testId)).get();
          if(td.exists){ var tv=td.data(); if(tv.title||tv.name){ testName=tv.title||tv.name; break; } }
        }
      }catch(_){ }
      if(looksLikeDocId(testName)) testName='';
    }
    var status = (c.status||'verified').toLowerCase();
    var ok = status==='verified';
    out.innerHTML =
      '<div class="card">'
      + '<div class="status '+(ok?'ok':'err')+'"><i class="fa-solid '+(ok?'fa-circle-check':'fa-triangle-exclamation')+'"></i> '+(ok?'VERIFIED · Authentic Certificate':'Status: '+esc(status))+'</div>'
      + row('Certificate ID', c.certId||id)
      + row('Student Name', c.studentName)
      + row('Class', displayName(c.classId, maps.cls))
      + row('Subject', displayName(c.subjectId, maps.sub))
      + row('Test', testName||'—')
      + row('Marks', (c.score||0)+' / '+(c.maxMarks||0))
      + row('Percentage', Number(c.percent||0).toFixed(2)+'%')
      + row('Issue Date', fmtDate(c.issuedAt))
      + row('Status', status.toUpperCase())
      + '</div>';
  } catch(e){
    out.innerHTML='<div class="card"><div class="status err"><i class="fa-solid fa-xmark-circle"></i> Verification failed: '+esc(e.message||e)+'</div></div>';
  }
}
function row(k,v){ return '<div class="row"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v||'—')+'</span></div>'; }

document.getElementById('lookupBtn').addEventListener('click', function(){ verify(document.getElementById('idInput').value.trim()); });
document.getElementById('idInput').addEventListener('keydown', function(e){ if(e.key==='Enter') verify(this.value.trim()); });

var q = new URLSearchParams(location.search).get('id');
if (q){ document.getElementById('idInput').value = q; verify(q); }
</script></body></html>
