<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="student-styles.css">
<link rel="icon" href="ultimate-logo.PNG"/><title>Certificate — PEEngine</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
.cert{background:linear-gradient(135deg,#0a1633,#0f2148);border:3px double var(--gold-400);
  border-radius:20px;padding:60px 40px;text-align:center;max-width:900px;margin:20px auto;position:relative}
.cert h2{font-size:36px;color:var(--gold-400);margin-bottom:8px}
.cert .sub{color:var(--ink-mute);margin-bottom:28px}
.cert .name{font-family:'Playfair Display',serif;font-size:42px;margin:20px 0;color:#fff;border-bottom:2px solid var(--gold-400);display:inline-block;padding:4px 30px}
.cert .body{font-size:16px;color:var(--ink-soft);line-height:1.9;margin-top:14px}
.cert .foot{display:flex;justify-content:space-between;margin-top:60px;font-size:13px;color:var(--ink-mute)}
.cert .seal{position:absolute;right:40px;top:40px;width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold-500),var(--gold-300));color:#1a1206;display:grid;place-items:center;font-weight:800;font-size:22px}
@media print{ body{background:#fff !important;color:#000 !important;padding:0} .no-print{display:none} .cert{background:#fff;border-color:#b8860b;color:#000} .cert .body,.cert .foot,.cert .sub{color:#333} .cert .name{color:#000} .cert h2{color:#b8860b} }
</style></head><body>
<header class="topbar no-print">
  <div class="brand"><div class="logo"><i class="fa-solid fa-certificate"></i></div><h1>Certificate</h1></div>
  <div class="nav">
    <button class="btn primary" id="downloadBtn"><i class="fa-solid fa-download"></i> Download PDF</button>
    <button class="btn" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
    <a class="btn ghost" href="student-my-results.html">Back</a>
    <button class="btn danger" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </div>
</header>
<div id="out"><p class="empty">Loading…</p></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config/firebase-init.js"></script>
<script src="config/admin-data.js"></script>
<script src="config/student-data.js"></script>
<script src="config/practice-data.js"></script>
<script>
Student.onChange(function(u){ if(!u){ location.href="student-login.html"; } });
document.addEventListener("click",function(e){
  if(e.target.closest("#logoutBtn")){ Student.logout().then(function(){ location.href="student-login.html"; }); }
});
</script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
var PASS_PCT = 90; // Certificate eligibility threshold

Student.onChange(async function(u){
  if(!u) return;
  var id=new URLSearchParams(location.search).get('id');
  // getAttempt now falls back to practice_attempts if not found in student_attempts.
  var r = id ? await Student.getAttempt(id) : null;
  if(!r){ document.getElementById('out').innerHTML='<p class="empty">Certificate not available.</p>'; return; }
  var status = (r.status||'pending').toLowerCase();
  if(status !== 'approved'){
    document.getElementById('out').innerHTML =
      '<div class="card"><p class="empty">Your result is <b>'+esc(status)+'</b>. '+
      'Certificate becomes available once the admin approves this attempt.</p></div>';
    return;
  }
  if((r.percent||0) < PASS_PCT){
    document.getElementById('out').innerHTML='<p class="empty">Certificate is available for scores of '+PASS_PCT+'% or higher. Your score: '+(r.percent||0).toFixed(1)+'%.</p>';
    return;
  }
  var prof = await Student.getProfile(u.uid) || {};
  var date = r.submittedAt&&r.submittedAt.toDate?r.submittedAt.toDate().toLocaleDateString():new Date().toLocaleDateString();
  document.getElementById('out').innerHTML =
    '<div class="cert" id="certCard"><div class="seal">PE</div>'+
    '<h2>Certificate of Achievement</h2>'+
    '<div class="sub">PEEngine — Physical Education Career</div>'+
    '<div class="body">This is to certify that</div>'+
    '<div class="name">'+esc(prof.name||r.studentName||u.email)+'</div>'+
    '<div class="body">has successfully completed the '+
      ((r.type==='practice')?'practice test':'live test')+
      '<br><strong>'+esc(r.testTitle||'')+'</strong><br>'+
    'with a score of <strong>'+(r.score||0)+' / '+(r.maxMarks||0)+' ('+(r.percent||0).toFixed(1)+'%)</strong>.</div>'+
    '<div class="foot"><div>Date: '+date+'</div><div>Certificate ID: '+r.id+'</div></div></div>';
});

document.getElementById('downloadBtn').addEventListener('click', async function(){
  var el = document.getElementById('certCard');
  if(!el){ alert('Certificate is not ready to download.'); return; }
  try{
    var canvas = await html2canvas(el, { backgroundColor: '#0a1633', scale: 2, useCORS: true });
    var img = canvas.toDataURL('image/png');
    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
    var pw = pdf.internal.pageSize.getWidth();
    var ph = pdf.internal.pageSize.getHeight();
    var ratio = Math.min(pw/canvas.width, ph/canvas.height);
    var w = canvas.width*ratio, h = canvas.height*ratio;
    pdf.addImage(img, 'PNG', (pw-w)/2, (ph-h)/2, w, h);
    pdf.save('certificate.pdf');
  }catch(e){ alert('Download failed: '+(e.message||e)); }
});
</script></body></html>
