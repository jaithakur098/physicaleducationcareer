<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Great+Vibes&family=Cinzel:wght@600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="student-styles.css">
<style>
/* ---- Certificate of Excellence — A4 landscape (1123x794 px @96dpi) ---- */
:root{--cert-bg:#f7f4e8;--cert-ink:#0a1f5c;--cert-gold:#d4af37;--cert-gold2:#b8860b;--cert-soft:#5b460a}
@media print{
  .no-print{display:none!important}
  #certContainer .cert{background:#fff;margin:0}
  body{background:#fff}
}
#certContainer{
  max-width:1123px;margin:0 auto;
  transform:scale(var(--cert-scale,1));transform-origin:top center;
  width:1123px;
}
.cert{
  position:relative;
  width:1123px;min-height:794px;
  background: var(--cert-bg);
  color: var(--cert-ink);
  font-family: 'Playfair Display', Georgia, serif;
  margin: 0 auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
  border-radius: 12px;
  overflow: hidden;
}
.outer-border{
  position:absolute;top:5px;left:5px;right:5px;bottom:5px;
  border:6px double var(--cert-gold);
  border-radius:8px;
  pointer-events:none;
}
.inner-border{
  position:absolute;top:20px;left:20px;right:20px;bottom:20px;
  border:1px solid rgba(10,31,92,.2);
  border-radius:4px;
  pointer-events:none;
}
.corner{
  position:absolute;width:44px;height:44px;
  color:var(--cert-gold);
  pointer-events:none;
}
.corner.c-tl{top:0;left:0;border-top:3px solid var(--cert-gold);border-left:3px solid var(--cert-gold)}
.corner.c-tr{top:0;right:0;border-top:3px solid var(--cert-gold);border-right:3px solid var(--cert-gold);transform:scale(-1,1)}
.corner.c-bl{bottom:0;left:0;border-bottom:3px solid var(--cert-gold);border-left:3px solid var(--cert-gold);transform:scale(1,-1)}
.corner.c-br{bottom:0;right:0;border-bottom:3px solid var(--cert-gold);border-right:3px solid var(--cert-gold);transform:scale(-1,-1)}
.cert-inner{
  position:relative;
  padding:56px 72px 64px 72px;
  height:794px;
  box-sizing:border-box;
}
.brand-strip{
  position:absolute;top:18px;left:72px;right:72px;
  display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:1px solid rgba(10,31,92,.15);
  padding-bottom:12px;
}
.org{
  font-family: 'Inter', sans-serif;
  font-size:15px;font-weight:700;
  color: var(--cert-ink);
  letter-spacing:.5px;
}
.org small{
  display:block;
  font-size:11px;
  font-weight:400;
  color: var(--cert-soft);
  margin-top:2px;
}
.cert-id{
  font-family:'Inter',sans-serif;
  font-size:12px;
  text-align:right;
  color:var(--cert-soft);
}
.cert-id b{
  font-family:monospace;
  font-size:16px;
  color:var(--cert-ink);
  letter-spacing:.05em;
}
.title{
  text-align:center;
  font-size:44px;
  font-family:'Cinzel',serif;
  font-weight:800;
  color:var(--cert-ink);
  letter-spacing:2px;
  margin-top:10px;
  margin-bottom:4px;
}
.title .flourish{
  color:var(--cert-gold);
  font-size:48px;
  line-height:1;
}
.subtitle{
  text-align:center;
  font-family:'Playfair Display',serif;
  font-size:20px;
  color:var(--cert-soft);
  margin-bottom:30px;
}
.name{
  text-align:center;
  font-family:'Great Vibes',cursive;
  font-size:54px;
  color:var(--cert-ink);
  margin:10px 0;
  line-height:1.1;
  letter-spacing:1px;
}
.name-underline{
  width:520px;height:2px;
  background:linear-gradient(90,transparent,var(--cert-gold),var(--cert-gold),transparent);
  margin:10px auto;
}
.body-copy{
  text-align:center;
  font-family:'Playfair Display',serif;
  font-size:17px;
  line-height:1.7;
  color:var(--cert-ink);
  margin:26px auto 22px;
  max-width:820px;
}
.body-copy b{
  color:var(--cert-gold);
  font-weight:700;
}
.details{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px 12px;
  max-width:960px;
  margin:18px auto 0;
  border-top:1px solid rgba(10,31,92,.12);
  padding-top:12px;
}
.details .det{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.details .det .k{
  font-family:'Inter',sans-serif;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:var(--cert-soft);
}
.details .det .v{
  font-family:'Playfair Display',serif;
  font-size:14px;
  font-weight:600;
  color:var(--cert-ink);
}
.details .det.wide{grid-column:1/-1}
.foot{
  position:absolute;
  bottom:56px;left:72px;right:72px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  border-top:1px solid rgba(10,31,92,.12);
  padding-top:18px;
}
.sig-block{
  text-align:center;
  min-width:180px;
}
.sig-scribble{
  font-family:'Great Vibes',cursive;
  font-size:32px;
  color:var(--cert-ink);
  margin-bottom:4px;
}
.sig-line{
  width:140px;height:1px;
  background:linear-gradient(90,transparent,var(--cert-ink),transparent);
  margin:0 auto 4px;
}
.sig-block .who{
  font-family:'Playfair Display',serif;
  font-size:15px;
  font-weight:700;
  color:var(--cert-ink);
}
.sig-block .role{
  font-family:'Inter',sans-serif;
  font-size:11px;
  color:var(--cert-soft);
  line-height:1.4;
}
.seal{
  margin:0 auto 4px;
  width:90px;height:90px;
  background: radial-gradient(circle,var(--cert-gold),var(--cert-gold2));
  border-radius:50%;
  display:grid;place-items:center;
  box-shadow:0 0 0 3px rgba(10,31,92,.15);
  color:var(--cert-ink);
  font-family:'Cinzel',serif;
  font-size:13px;
  font-weight:700;
  line-height:1.2;
}
.seal .ribbon{
  position:absolute;
  top:-6px;right:-6px;
  width:34px;height:34px;
  background:var(--cert-gold);
  border-radius:50%;
  transform:rotate(30deg);
}
.qr-block{
  text-align:center;
}
.qr-block img{
  width:140px;height:140px;
  background:#fff;
  border:1px solid rgba(10,31,92,.15);
  border-radius:4px;
  padding:4px;
}
.qr-block .lbl{
  font-family:'Inter',sans-serif;
  font-size:11px;
  color:var(--cert-soft);
  margin-top:4px;
  font-weight:600;
}
.not-eligible{
  text-align:center;
  padding:60px 40px;
  color:var(--cert-ink);
}
.not-eligible i{font-size:44px;color:var(--cert-gold);margin-bottom:14px}
.not-eligible h2{font-family:'Cinzel',serif;font-size:28px;color:var(--cert-gold);letter-spacing:.1em}
.not-eligible p{font-size:16px;margin:10px 0}
.cert-shell{max-width:1123px;margin:0 auto;padding:12px}
.cert-actions{
  display:flex;gap:10px;justify-content:center;
  margin-bottom:18px;
}
.no-print{margin-bottom:24px}
.gold-btn{
  background:linear-gradient(135deg,var(--cert-gold),var(--cert-gold2));
  color:#1a1206;border:none;
  padding:11px 20px;
  border-radius:10px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:8px;
  box-shadow:0 4px 16px rgba(212,175,55,.3);
}
.gold-btn:hover{filter:brightness(1.08)}
.gold-btn.ghost{
  background:transparent;
  color:var(--gold-400);
  border:1px solid var(--gold-400);
  box-shadow:none;
}
</style>
<link rel="icon" href="ultimate-logo.PNG"/>
<title>Certificate of Excellence — PEEngine</title>




<header class="topbar no-print">
  <div class="brand"><div class="logo"><i class="fa-solid fa-award"></i></div><h1>Certificate <span>of Excellence</span></h1></div>
  <nav class="nav">
    <a class="btn ghost" href="student-my-results.html"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </nav>
</header>

<div class="cert-shell">
  <div class="cert-actions no-print">
    <button class="gold-btn" id="downloadPdf"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
    <button class="gold-btn" id="downloadPng"><i class="fa-solid fa-image"></i> Download PNG</button>
    <button class="gold-btn" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
    <button class="gold-btn" id="shareBtn"><i class="fa-solid fa-share-nodes"></i> Share</button>
  </div>

  <div id="certContainer"><p class="empty" style="color:#dbe4ff">Loading certificate…</p></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config/firebase-init.js"></script>
<script src="config/admin-data.js"></script>
<script src="config/student-data.js"></script>
<script src="config/practice-data.js"></script>
<script src="js/pec-upgrades.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  var PASS_PCT = 90;
  function esc(s){ return PEC.esc(s); }
  function fmtTime(sec){ sec=Number(sec)||0; var m=Math.floor(sec/60), s=sec%60; return m+'m '+String(s).padStart(2,'0')+'s'; }
  function fmtDate(d){ try { return d && d.toDate ? d.toDate().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}) : new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}); } catch(_){ return new Date().toLocaleDateString(); } }

  /* ---- Master Data label resolver (same source as Practice Test Manager) ---- */
  function looksLikeDocId(v){ v=String(v==null?'':v).trim(); return /^[A-Za-z0-9_-]{16,}$/.test(v); }
  async function loadNameMaps(){
    var maps={cls:{},sub:{},ch:{}};
    try{
      var r=await Promise.all([AdminData.listAllClasses(),AdminData.listAllSubjects(),AdminData.listAllChapters()]);
      r[0].forEach(function(c){ maps.cls[String(c.id).toLowerCase()]=c.label||c.name||c.title||''; });
      r[1].forEach(function(sj){ maps.sub[String(sj.id).toLowerCase()]=sj.label||sj.name||sj.title||''; });
      r[2].forEach(function(ch){ maps.ch[String(ch.id).toLowerCase()]=ch.title||ch.label||ch.name||''; });
    }catch(e){ console.warn('[certificate] loadNameMaps failed', e); }
    return maps;
  }
  function displayName(raw, map){
    raw=String(raw==null?'':raw).trim();
    if(!raw) return '';
    var hit=map && map[raw.toLowerCase()];
    if(hit) return hit;
    return looksLikeDocId(raw) ? '' : raw; // never show Firestore document IDs
  }
  async function resolveTestName(attempt){
    var t=String(attempt.testTitle||'').trim();
    if(t && !looksLikeDocId(t)) return t;
    if(attempt.testId){
      try{
        var col = attempt.type==='practice' ? 'practice_tests' : 'live_tests';
        var snap = await firebase.firestore().collection(col).doc(String(attempt.testId)).get();
        if(snap.exists){ var d=snap.data(); if(d.title||d.name) return d.title||d.name; }
      }catch(_){ }
    }
    return looksLikeDocId(t) ? '' : t;
  }

  async function loadAttempt(id){
    if (!id) return null;
    var db = firebase.firestore();
    // Try both collections.
    var cols = ['practice_attempts','student_attempts'];
    for (var i=0;i<cols.length;i++){
      var s = await db.collection(cols[i]).doc(id).get();
      if (s.exists) return Object.assign({id:s.id, __col:cols[i], type: cols[i]==='practice_attempts'?'practice':'live'}, s.data());
    }
    return null;
  }

  async function computeRank(a){
    if (!a || !a.testId) return null;
    try {
      var snap = await firebase.firestore().collection(a.__col).where('testId','==',a.testId).get();
      var rows = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      var best = {};
      rows.forEach(function(r){ var u=r.studentId||r.id; if(!best[u] || (r.score||0)>(best[u].score||0)) best[u]=r; });
      var arr = Object.keys(best).map(function(k){ return best[k]; });
      arr.sort(function(x,y){ if((y.score||0)!==(x.score||0)) return (y.score||0)-(x.score||0); return (x.durationSec||0)-(y.durationSec||0); });
      for (var i=0;i<arr.length;i++) if (arr[i].studentId===a.studentId) return { rank:i+1, of:arr.length };
    } catch(_){ }
    return null;
  }

  function render(cert, attempt, profile, rank, names){
    names = names || {};
    var verifyUrl = location.origin + location.pathname.replace(/[^\/]*$/, '') + 'certificate-verify.html?id=' + encodeURIComponent(cert.certId);
    var qr = PEC.qrUrl(verifyUrl, 200);
    var studentName = cert.studentName || profile.name || attempt.studentName || attempt.studentEmail || 'Student';
    var testNo = attempt.testNo || attempt.testNumber || '';
    var className = names.className || '';
    var subjectName = names.subjectName || '';
    var chName = names.chapterName || (looksLikeDocId(attempt.chapterName)?'':String(attempt.chapterName||''));
    var chNo = attempt.chapterNo || '';
    var testName = names.testName || '';
    var attempted = (attempt.answers||[]).filter(function(x){ return x.picked; }).length;
    var unatt = Math.max(0, (attempt.total||0) - attempted);

    document.getElementById('certContainer').innerHTML =
      '<div class="cert" id="certNode">'
      + '<div class="outer-border"></div><div class="inner-border"></div>'
      + '<div class="corner c-tl"></div><div class="corner c-tr"></div><div class="corner c-bl"></div><div class="corner c-br"></div>'
      + '<div class="cert-inner">'
      +   '<div class="brand-strip">'
      +     '<div class="org">PHYSICALEDUCATIONCAREER.IN<small>CBSE Physical Education · Digital Learning Platform</small></div>'
      +     '<div class="cert-id">Certificate ID<br><b style="color:#0a1f5c;font-family:monospace;letter-spacing:.06em">'+esc(cert.certId)+'</b></div>'
      +   '</div>'
      +   '<div class="title">CERTIFICATE <span class="flourish">·</span> OF <span class="flourish">·</span> EXCELLENCE</div>'
      +   '<div class="subtitle">This certificate is proudly presented to</div>'
      +   '<div class="name">'+esc(studentName)+'</div>'
      +   '<div class="name-underline"></div>'
      +   '<div class="body-copy">For <b>outstanding performance</b> in the online examination conducted by <b>PhysicalEducationCareer.in</b> — securing '
      +     '<b>'+(attempt.score||0)+' / '+(attempt.maxMarks||0)+' marks ('+Number(attempt.percent||0).toFixed(2)+'%)</b> '
      +     'in <b>'+esc(testName||'Online Test')+'</b>.'
      +   '</div>'
      +   '<div class="details">'
      +     detBox('Class', className)
      +     detBox('Subject', subjectName)
      +     detBox('Chapter', (chName? ((chNo&&String(chNo)!==chName?chNo+' · ':'')+chName):(chNo||'—')))
      +     detBox('Test', (testNo? ('#'+testNo+' '):'') + (testName||'—'))
      +     detBox('Correct', String(attempt.correct||0)+' / '+(attempt.total||0))
      +     detBox('Wrong', String(attempt.wrong||0))
      +     detBox('Unattempted', String(unatt))
      +     detBox('Time Taken', fmtTime(attempt.durationSec))
      +     detBox('Rank', rank? ('#'+rank.rank+' of '+rank.of) : '—')
      +     detBox('Date', fmtDate(cert.issuedAt || attempt.submittedAt))
      +     detBox('Percentage', Number(attempt.percent||0).toFixed(2)+'%')
      +     detBox('Marks Obtained', (attempt.score||0)+' / '+(attempt.maxMarks||0))
      +   '</div>'
      +   '<div class="foot">'
      +     '<div class="sig-block">'
      +       '<div class="sig-scribble">Jai Thakur</div>'
      +       '<div class="sig-line"></div>'
      +       '<div class="who">JAI THAKUR</div>'
      +       '<div class="role">M.P.Ed · NIS Coach<br>Delhi Public School, Alwar<br>Director — PhysicalEducationCareer.in</div>'
      +     '</div>'
      +     '<div class="sig-block">'
      +       '<div class="seal">VERIFIED<br>PhysicalEducation<br>Career.in<br>OFFICIAL<div class="ribbon"></div></div>'
      +       '<div class="role" style="margin-top:6px">Official Digital Seal</div>'
      +     '</div>'
      +     '<div class="qr-block">'
      +       '<img src="'+qr+'" alt="QR verification code" crossorigin="anonymous">'
      +       '<div class="lbl">Scan to verify<br>'+esc(cert.certId)+'</div>'
      +     '</div>'
      +   '</div>'
      + '</div></div>';
  }
  function detBox(k,v){ return '<div class="det"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v||'—')+'</div></div>'; }

  function notEligible(pct){
    document.getElementById('certContainer').innerHTML =
      '<div class="not-eligible"><i class="fa-solid fa-lock"></i>'
      + '<h2 style="margin:0 0 8px;color:#d4af37;font-family:Cinzel,serif;letter-spacing:.1em">CERTIFICATE NOT ELIGIBLE</h2>'
      + '<p style="color:#dbe4ff;margin:8px 0 0">A certificate is awarded only when your score is <b>90% or higher</b>.'
      + '<br>Your score: <b>'+Number(pct||0).toFixed(2)+'%</b>. Try again — you\'re close!</p>'
      + '<p style="margin-top:20px"><a class="gold-btn" href="student-my-results.html" style="display:inline-block;text-decoration:none">Back to Results</a></p>'
      + '</div>';
    document.querySelector('.cert-actions').style.display='none';
  }

  async function renderFor(id){
    var attempt = await loadAttempt(id);
    if (!attempt){ document.getElementById('certContainer').innerHTML='<p class="empty" style="color:#dbe4ff">Attempt not found.</p>'; return; }
    if ((attempt.percent||0) < PASS_PCT){ notEligible(attempt.percent); return; }
    var profile = {};
    try { profile = (attempt.studentId && await Student.getProfile(attempt.studentId)) || {}; } catch(_){}
    var cert = await PEC.ensureCertificate(attempt, profile);
    if (!cert){ document.getElementById('certContainer').innerHTML='<p class="empty" style="color:#dbe4ff">Could not generate certificate.</p>'; return; }
    var rank = await computeRank(attempt);
    var maps = await loadNameMaps();
    var names = {
      className:   displayName(attempt.classId   || cert.classId,   maps.cls) || displayName(attempt.className, null),
      subjectName: displayName(attempt.subjectId || cert.subjectId, maps.sub) || displayName(attempt.subjectName, null),
      chapterName: displayName(attempt.chapterId || cert.chapterId, maps.ch)  || displayName(attempt.chapterName, null),
      testName:    await resolveTestName(attempt)
    };
    render(cert, attempt, profile, rank, names);
    if (window.PECAds) PECAds.triggerAction('certificate_view');
    window.__cert = cert;
    fitCert();
  }

  /* Keep the A4 certificate scaled to the REAL container width on small
     screens (320-768px): no zoom, overflow, cropping or horizontal scroll. */
  function fitCert(){
    var c = document.getElementById('certContainer');
    if (!c) return;
    if (window.innerWidth > 900){ c.style.removeProperty('--cert-scale'); c.style.removeProperty('height'); return; }
    var w = c.clientWidth;
    if (w > 0){
      var scale = w / 1123;
      c.style.setProperty('--cert-scale', String(scale));
      c.style.height = (794 * scale) + 'px';
    }
  }
  window.addEventListener('resize', fitCert);
  window.addEventListener('orientationchange', fitCert);

  async function toCanvas(){
    var el = document.getElementById('certNode');
    return html2canvas(el, { scale: 2, backgroundColor:'#f7f4e8', useCORS:true, allowTaint:true });
  }
  async function downloadPdf(){
    if (!document.getElementById('certNode')) return;
    var canvas = await toCanvas();
    var img = canvas.toDataURL('image/jpeg', 0.95);
    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
    var pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    pdf.addImage(img, 'JPEG', 0, 0, pw, ph);
    pdf.save('Certificate-'+(window.__cert?window.__cert.certId:'PEC')+'.pdf');
    PEC.bumpDownloadCount(window.__cert && window.__cert.certId);
  }
  async function downloadPng(){
    if (!document.getElementById('certNode')) return;
    var canvas = await toCanvas();
    var a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'Certificate-'+(window.__cert?window.__cert.certId:'PEC')+'.png';
    document.body.appendChild(a); a.click(); a.remove();
    PEC.bumpDownloadCount(window.__cert && window.__cert.certId);
  }
  async function share(){
    var url = location.href;
    var text = 'I earned a Certificate of Excellence from PhysicalEducationCareer.in!';
    if (navigator.share){ try { await navigator.share({ title:'PEEngine Certificate', text:text, url:url }); return; } catch(_){} }
    try { await navigator.clipboard.writeText(url); PEC.toast('Certificate link copied','ok'); } catch(_){ prompt('Copy link:', url); }
  }
  document.getElementById('downloadPdf').addEventListener('click', downloadPdf);
  document.getElementById('downloadPng').addEventListener('click', downloadPng);
  document.getElementById('downloadPdf').addEventListener('click', function(){ if(window.PECAds) PECAds.triggerAction('certificate_download'); });
  document.getElementById('downloadPng').addEventListener('click', function(){ if(window.PECAds) PECAds.triggerAction('certificate_download'); });
  document.getElementById('shareBtn').addEventListener('click', share);

  Student.onChange(function(u){
    if(!u){ location.href='student-login.html'; return; }
    var id = new URLSearchParams(location.search).get('id');
    if(!id){ document.getElementById('certContainer').innerHTML='<p class="empty" style="color:#dbe4ff">Missing attempt id.</p>'; return; }
    renderFor(id);
  });
})();
 </script>
