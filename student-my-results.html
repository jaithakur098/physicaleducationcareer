<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="student-styles.css">
<link rel="icon" href="ultimate-logo.PNG"/><title>My Results — PEEngine</title></head><body>
<header class="topbar">
  <div class="brand"><div class="logo"><i class="fa-solid fa-chart-line"></i></div><h1>My <span>Results</span></h1></div>
  <nav class="nav">
  <a class="btn ghost" href="student-dashboard.html">Dashboard</a>
  <a class="btn ghost" href="student-live-tests.html">Live Tests</a>
  <a class="btn ghost" href="student-my-results.html">My Results</a>
  <a class="btn ghost" href="student-analytics.html">Analytics</a>
  <a class="btn ghost" href="student-profile.html">Profile</a>
  <button class="btn danger" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</nav>
</header>
<div class="card"><div id="wrap"><p class="empty">Loading…</p></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config/firebase-init.js"></script>
<script src="config/admin-data.js"></script>
<script src="config/student-data.js"></script><script>
Student.onChange(function(u){ if(!u){ location.href="student-login.html"; } });
document.addEventListener("click",function(e){
  if(e.target.closest("#logoutBtn")){ Student.logout().then(function(){ location.href="student-login.html"; }); }
});
</script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
Student.onChange(async function(u){
  if(!u) return;
  var rs = await Student.myResults(u.uid);
  var w=document.getElementById('wrap');
  if(!rs.length){ w.innerHTML='<p class="empty">No attempts yet.</p>'; return; }
  w.innerHTML='<table><thead><tr><th>Test</th><th>Score</th><th>%</th><th>Correct</th><th>Date</th><th></th></tr></thead><tbody>'+
    rs.map(function(r){
      var d=r.submittedAt&&r.submittedAt.toDate?r.submittedAt.toDate().toLocaleString():'—';
      return '<tr><td>'+esc(r.testTitle||'')+'</td>'+
        '<td class="mono">'+r.score+'/'+r.maxMarks+'</td>'+
        '<td class="mono">'+(r.percent||0).toFixed(1)+'%</td>'+
        '<td class="mono">'+r.correct+'/'+r.total+'</td>'+
        '<td>'+d+'</td>'+
        '<td><a class="btn ghost" href="student-result.html?id='+r.id+'">View</a></td></tr>';
    }).join('')+'</tbody></table>';
});
</script></body></html>
