<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="student-styles.css">
<link rel="icon" href="ultimate-logo.PNG"/>
<title>Practice Result — PEEngine</title></head><body>
<header class="topbar">
  <div class="brand"><div class="logo"><i class="fa-solid fa-trophy"></i></div><h1>Practice <span>Result</span></h1></div>
  <nav class="nav">
    <a class="btn ghost" href="student-practice-tests.html">Back to Practice Tests</a>
    <a class="btn ghost" href="student-dashboard.html">Dashboard</a>
  </nav>
</header>
<div id="wrap" class="card"><p class="empty">Loading…</p></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config/firebase-init.js"></script>
<script src="config/admin-data.js"></script>
<script src="config/student-data.js"></script>
<script src="config/practice-data.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
var id=new URLSearchParams(location.search).get('id');
Student.onChange(async function(u){
  if(!u){ location.href='student-login.html'; return; }
  var wrap=document.getElementById('wrap');
  if(!id){ wrap.innerHTML='<p class="empty">Missing attempt id.</p>'; return; }
  var r = await Practice.getAttempt(id);
  if(!r){ wrap.innerHTML='<p class="empty">Attempt not found.</p>'; return; }
  wrap.innerHTML =
    '<h2 style="margin-top:0">'+esc(r.testTitle||'Practice Test')+'</h2>'+
    '<div class="grid g-4" style="margin-top:12px">'+
      '<div class="card stat"><span class="l">Score</span><span class="n mono">'+(r.score||0)+' / '+(r.maxMarks||0)+'</span></div>'+
      '<div class="card stat"><span class="l">Percent</span><span class="n mono">'+((r.percent||0).toFixed(1))+'%</span></div>'+
      '<div class="card stat"><span class="l">Correct</span><span class="n mono">'+(r.correct||0)+' / '+(r.total||0)+'</span></div>'+
      '<div class="card stat"><span class="l">Wrong</span><span class="n mono">'+(r.wrong||0)+'</span></div>'+
    '</div>'+
    '<p class="meta" style="margin-top:14px">Duration: '+(r.durationSec||0)+' sec '+(r.autoSubmitted?'· Auto submitted':'')+'</p>'+
    '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">'+
      '<a class="btn primary" href="student-practice-leaderboard.html?id='+esc(r.testId||'')+'"><i class="fa-solid fa-trophy"></i> View Leaderboard</a>'+
      '<a class="btn" href="student-practice-tests.html">More Practice Tests</a>'+
    '</div>';
});
</script></body></html>
