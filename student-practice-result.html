<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="student-styles.css">
<link rel="icon" href="ultimate-logo.PNG"/>
<title>Practice Result — PEEngine</title>
<style>
.gold-cta{background:linear-gradient(135deg,#d4af37,#b8860b)!important;color:#1a1206!important;font-weight:800;border:none!important;box-shadow:0 8px 24px rgba(212,175,55,.3)}
.gold-cta:hover{filter:brightness(1.08)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.summary-grid .card.stat{background:rgba(15,33,72,.55);border:1px solid var(--glass-border);border-radius:10px;padding:12px}
.summary-grid .l{color:var(--ink-mute);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.summary-grid .n{font-family:'Playfair Display',serif;font-size:22px;color:#d4af37;margin-top:4px}
.review-hdr{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.review-card{background:rgba(15,33,72,.5);border:1px solid var(--glass-border);border-radius:14px;padding:20px;margin-bottom:14px}
.opt-row{padding:12px 14px;border:1px solid var(--glass-border);border-radius:10px;margin:8px 0;display:flex;gap:12px;align-items:flex-start}
.opt-letter{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto}
.opt-row.correct{background:rgba(46,204,113,.14);border-color:#2ecc71}
.opt-row.wrong{background:rgba(231,76,60,.14);border-color:#e74c3c}
.opt-row .tag{margin-left:auto;font-size:11px;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.opt-row.correct .tag{background:#2ecc71;color:#08331d}
.opt-row.wrong .tag{background:#e74c3c;color:#fff}
.not-attempted-box{margin-top:10px;padding:10px 14px;border-radius:8px;background:rgba(230,146,35,.1);border:1px solid #e67e22;color:#f39c12;font-size:13px}
</style></head><body>
<header class="topbar">
  <div class="brand"><div class="logo"><i class="fa-solid fa-trophy"></i></div><h1>Practice <span>Result</span></h1></div>
  <nav class="nav">
    <a class="btn ghost" href="student-practice-tests.html">Practice Tests</a>
    <a class="btn ghost" href="student-dashboard.html">Dashboard</a>
  </nav>
</header>
<div id="wrap" class="card"><p class="empty">Loading…</p></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config/firebase-init.js"></script>
<script src="config/admin-data.js"></script>
<script src="config/student-data.js"></script>
<script src="config/practice-data.js"></script>
<script src="js/pec-upgrades.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function fmtTime(sec){ sec=Number(sec)||0; var m=Math.floor(sec/60), s=sec%60; return m+'m '+String(s).padStart(2,'0')+'s'; }
var id=new URLSearchParams(location.search).get('id');
Student.onChange(async function(u){
  if(!u){ location.href='student-login.html'; return; }
  var wrap=document.getElementById('wrap');
  if(!id){ wrap.innerHTML='<p class="empty">Missing attempt id.</p>'; return; }
  var r = await Practice.getAttempt(id);
  if(!r){ wrap.innerHTML='<p class="empty">Attempt not found.</p>'; return; }
  if (window.PECAds) PECAds.triggerAction('result_view');
  var attempted = (r.answers||[]).filter(function(a){ return a.picked; }).length;
  var unatt = Math.max(0, (r.total||0) - attempted);
  var eligible = (r.percent||0) >= 90;

  wrap.innerHTML =
    '<h2 style="margin-top:0">'+esc(r.testTitle||'Practice Test')+'</h2>'+
    '<div class="summary-grid">'+
      '<div class="card stat"><span class="l">Score</span><div class="n mono">'+(r.score||0)+' / '+(r.maxMarks||0)+'</div></div>'+
      '<div class="card stat"><span class="l">Percentage</span><div class="n mono">'+((r.percent||0).toFixed(2))+'%</div></div>'+
      '<div class="card stat"><span class="l">Correct</span><div class="n mono" style="color:#2ecc71">'+(r.correct||0)+'</div></div>'+
      '<div class="card stat"><span class="l">Wrong</span><div class="n mono" style="color:#e74c3c">'+(r.wrong||0)+'</div></div>'+
      '<div class="card stat"><span class="l">Unattempted</span><div class="n mono">'+unatt+'</div></div>'+
      '<div class="card stat"><span class="l">Time Taken</span><div class="n mono">'+fmtTime(r.durationSec)+'</div></div>'+
    '</div>'+
     '<p class="meta" style="margin-top:14px">'+(r.autoSubmitted?'Auto submitted · ':'')+'Submitted successfully. Leaderboard updates only after final submission.</p>'+
     '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">'+
       '<a class="btn primary" href="student-review.html?type=practice&id='+esc(r.id||id)+'"><i class="fa-solid fa-clipboard-check"></i> Review Answers</a>'+
       '<a class="btn" href="student-practice-leaderboard.html?id='+esc(r.testId||'')+'"><i class="fa-solid fa-trophy"></i> Leaderboard</a>'+
       (eligible
         ? '<a class="btn gold-cta" href="student-certificate.html?id='+esc(r.id||id)+'"><i class="fa-solid fa-award"></i> 🏆 Download Certificate</a>'
         : '<span class="btn ghost" title="Score 90%+ required" style="cursor:not-allowed;opacity:.6"><i class="fa-solid fa-lock"></i> Certificate — need 90%+</span>')+
       '<a class="btn ghost" href="student-practice-tests.html">More Tests</a>'+
     '</div>';

    // ---- Solved Questions / Answer Review ----
    var db=firebase.firestore();
    var answers=(r.answers||[]);
    if(!answers.length){
      wrap.innerHTML += '<div class="card" style="margin-top:20px"><h3 style="margin-top:0">Solved Questions</h3><p class="empty">No answer data available for review.</p></div>';
    } else {
      var qids=answers.map(function(a){return a.qid;}).filter(Boolean);
      var qmap={};
      for(var i=0;i<qids.length;i++){
        if(qmap[qids[i]]) continue;
        try{
          var snap=await db.collection('questions').doc(qids[i]).get();
          if(snap.exists) qmap[qids[i]]=Object.assign({id:snap.id},snap.data());
          else qmap[qids[i]]={missing:true};
        }catch(e){ qmap[qids[i]]={missing:true}; }
      }

      var section='<div class="card" style="margin-top:20px"><h3 style="margin-top:0">Solved Questions</h3>';
      section+='<div class="review-hdr">'+
        '<div class="card stat"><span class="l">Correct</span><div class="n mono" style="color:#2ecc71">'+(r.correct||0)+'</div></div>'+
        '<div class="card stat"><span class="l">Wrong</span><div class="n mono" style="color:#e74c3c">'+(r.wrong||0)+'</div></div>'+
        '<div class="card stat"><span class="l">Not Attempted</span><div class="n mono">'+Math.max(0,(r.total||0)-attempted)+'</div></div>'+
        '<div class="card stat"><span class="l">Score</span><div class="n mono">'+(r.score||0)+' / '+(r.maxMarks||0)+'</div></div>'+
        '</div>';

      for(var i=0;i<answers.length;i++){
        var a=answers[i];
        var q=qmap[a.qid];
        var correctLetter = (a.correct||'').toString().toUpperCase();
        var pickedLetter = (a.picked||a.selected||a.chosen||'').toString().toUpperCase();
        var isUnattempted = (!pickedLetter || pickedLetter==='NULL');
        function pickObj(o){ for(var i=1;i<arguments.length;i++){var v=o[arguments[i]]; if(v!=null&&v!=='')return v;} return '';}
        var oArr = q && (q.options||q.opts||null);
        var optTexts=[
          {L:'A',txt:pickObj(q||{},'optionA','option_a','OptionA','a','A')},
          {L:'B',txt:pickObj(q||{},'optionB','option_b','OptionB','b','B')},
          {L:'C',txt:pickObj(q||{},'optionC','option_c','OptionC','c','C')},
          {L:'D',txt:pickObj(q||{},'optionD','option_d','OptionD','d','D')}
        ];
        if((!optTexts[0].txt||!optTexts[1].txt||!optTexts[2].txt||!optTexts[3].txt) && oArr && oArr.length){
          optTexts=[
            {L:'A',txt:oArr[0]||''},{L:'B',txt:oArr[1]||''},
            {L:'C',txt:oArr[2]||''},{L:'D',txt:oArr[3]||''}
          ];
        }
        section+='<div class="review-card">';
        section+='<div class="qmeta">Question '+(i+1)+' of '+answers.length+'</div>';
        if(!q){
          section+='<p class="empty">Question data not available.</p>';
        } else if(q.missing){
          section+='<p class="empty">Original question was removed from the bank.</p>';
        } else {
          section+='<h3 style="margin:6px 0 12px;font-family:Playfair Display,serif">'+
            esc(q.question||q.text||q.questionText||q.q||'—')+'</h3>';
          optTexts.forEach(function(o){
            var isCorrect = (o.L===correctLetter);
            var isPicked  = (pickedLetter && o.L===pickedLetter);
            var cls='', tag='';
            if(isCorrect){ cls='correct'; tag='<span class="tag">✓ Correct Answer</span>'; }
            else if(isPicked){ cls='wrong'; tag='<span class="tag">✗ Your Answer</span>'; }
            if(isCorrect && isPicked){ cls='correct'; tag='<span class="tag">✓ Your Answer (Correct)</span>'; }
            section+='<div class="opt-row '+cls+'">'+
              '<div class="opt-letter">'+o.L+'</div>'+
              '<div style="flex:1">'+esc(o.txt||'—')+'</div>'+tag+'</div>';
          });
          if(isUnattempted){
            section+='<div class="not-attempted-box"><i class="fa-solid fa-circle-info"></i> You did not attempt this question.</div>';
          }
        }
        var _expl = q && (q.explanation||q.explaination||q.solution||'');
        if(_expl) section+='<div class="expl"><b>Explanation:</b> '+esc(_expl)+'</div>';
        section+='</div>';
      }
      section+='</div>';
      wrap.innerHTML += section;
    }
});
 </script>  

<script src="/js/site-ads.js"></script>
</body></html>
